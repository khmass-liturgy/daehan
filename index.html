<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>대한가축약품 조회</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💊</text></svg>">
<style>
:root {
  --bg:#0f1117; --bg2:#181c26; --bg3:#1e2330;
  --border:#252b3b; --border2:#2e3650;
  --text:#e8eaf0; --text2:#8b90a0; --text3:#4a5068;
  --blue:#4f8ef7; --green:#3ecf8e; --amber:#f0a050;
  --red:#e05555; --purple:#9b7ff0; --teal:#36c4a0;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:14px;min-height:100vh}

#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:200}
#login-screen.hide{display:none}
.login-box{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:36px 32px;width:320px;text-align:center}
.login-logo{font-size:20px;font-weight:700;margin-bottom:6px}
.login-logo span{color:var(--blue)}
.login-sub{font-size:12px;color:var(--text3);margin-bottom:24px}
.login-box input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:12px 14px;color:var(--text);font-size:14px;margin-bottom:10px;outline:none}
.login-box input:focus{border-color:var(--blue)}
.login-btn{width:100%;background:var(--blue);border:none;border-radius:8px;padding:12px;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.login-btn:hover{opacity:.88}
.login-err{color:var(--red);font-size:12px;margin-top:8px;min-height:18px}
.login-cloud{margin-top:16px;font-size:11px;color:var(--text3);display:flex;align-items:center;justify-content:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}

#app{display:none;flex-direction:column;min-height:100vh}
#app.show{display:flex}

header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-size:15px;font-weight:700}.logo span{color:var(--blue)}
.badge{background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--text2)}

nav{background:var(--bg2);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
.nav-tab{flex-shrink:0;padding:12px 20px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.nav-tab.active{color:var(--blue);border-bottom-color:var(--blue)}

main{flex:1;padding:16px;max-width:1100px;width:100%;margin:0 auto}

.search-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.search-input{flex:1;min-width:180px;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;outline:none}
.search-input:focus{border-color:var(--blue)}
.search-btn{background:var(--blue);border:none;border-radius:8px;padding:10px 18px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.search-btn:hover{opacity:.88}
.toggle-btn{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;color:var(--text2);font-size:12px;cursor:pointer;white-space:nowrap}
.toggle-btn.on{background:var(--teal);border-color:var(--teal);color:#fff}
select.filter{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:10px 12px;color:var(--text);font-size:13px;outline:none;cursor:pointer}

.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card-title{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}

.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:600px){.kpi-grid{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.kpi.b::before{background:var(--blue)}.kpi.g::before{background:var(--green)}
.kpi.a::before{background:var(--amber)}.kpi.p::before{background:var(--purple)}
.kpi-lbl{font-size:10px;color:var(--text3);margin-bottom:6px;letter-spacing:.4px;text-transform:uppercase}
.kpi-val{font-size:22px;font-weight:700;line-height:1}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:5px}

.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:500px}
th{font-size:10px;color:var(--text3);text-align:left;padding:0 10px 8px;font-weight:500;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--bg3);font-size:12px;color:var(--text);white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg3)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600}
.tag-매출{background:#1a2d4f;color:var(--blue)}
.tag-매입{background:#2d2010;color:var(--amber)}
.tag-수금{background:#0f2d1f;color:var(--green)}
.tag-지급{background:#2d1010;color:var(--red)}
.tag-재고있음{background:#0f2d1f;color:var(--green)}
.tag-재고없음{background:#2d1010;color:var(--red)}
.tag-외상{background:#1e1e3a;color:var(--purple)}
.tag-현금{background:#1a2d1a;color:var(--green)}

.empty{text-align:center;padding:48px 0;color:var(--text3);font-size:13px}
.loading{text-align:center;padding:32px;color:var(--text3)}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

.pos{color:var(--amber)}.neg{color:var(--green)}.zero{color:var(--text3)}
@media(max-width:600px){.hide-mobile{display:none}}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">대한<span>가축약품</span></div>
    <div class="login-sub">클라우드 조회 시스템</div>
    <input type="password" id="token-input" placeholder="접속 코드 입력" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">접속</button>
    <div class="login-err" id="login-err"></div>
    <div class="login-cloud"><span class="dot"></span> Firebase 클라우드 · 24시간 조회 가능</div>
  </div>
</div>

<div id="app">
  <header>
    <div class="logo">대한<span>가축약품</span></div>
    <div class="badge" id="data-date">-</div>
  </header>

  <nav>
    <div class="nav-tab active" onclick="showTab('stock')">제품정보</div>
    <div class="nav-tab" onclick="showTab('balance')">거래처 잔액</div>
    <div class="nav-tab" onclick="showTab('salesrank')">매출 순위</div>
    <div class="nav-tab" onclick="showTab('txn')">거래내역</div>
    <div class="nav-tab" onclick="showTab('inactive')">미거래 관리</div>
    <div class="nav-tab" onclick="showTab('info')">거래처 정보</div>
    <div class="nav-tab" onclick="showTab('qia')">동물약품 검색</div>
  </nav>

  <main>
    <div id="tab-stock">
      <div class="search-row">
        <button class="toggle-btn on" id="stock-mode-all" onclick="setStockMode('all')">전체 재고</button>
        <button class="toggle-btn" id="stock-mode-mfg" onclick="setStockMode('mfg')">제조사별</button>
        <button class="toggle-btn" id="stock-mode-cust" onclick="setStockMode('cust')">거래처 구매내역</button>
      </div>
      
      <!-- 전체/제조사 모드 -->
      <div id="stock-search-normal" class="search-row">
        <input class="search-input" id="stock-q" placeholder="품명 또는 제조사 검색..." onkeydown="if(event.key==='Enter')searchStock()">
        <select class="filter" id="stock-mfg" onchange="searchStock()" style="display:none">
          <option value="">제조사 선택</option>
        </select>
        <button class="toggle-btn" id="stock-only-btn" onclick="toggleStockOnly()">재고있음만</button>
        <button class="search-btn" onclick="searchStock()">검색</button>
      </div>
      
      <!-- 제품 축종 필터 -->
      <div id="stock-species-row" class="search-row">
        <button class="toggle-btn on" id="sp-all" onclick="setStockSpecies('all')">축종 전체</button>
        <button class="toggle-btn" id="sp-양계" onclick="setStockSpecies('양계')">🐔 양계</button>
        <button class="toggle-btn" id="sp-양돈" onclick="setStockSpecies('양돈')">🐷 양돈</button>
        <button class="toggle-btn" id="sp-축우" onclick="setStockSpecies('축우')">🐄 축우</button>
        <button class="toggle-btn" id="sp-공통" onclick="setStockSpecies('공통')">공통</button>
        <button class="toggle-btn" id="sp-미지정" onclick="setStockSpecies('미지정')">미지정</button>
      </div>
      
      <!-- 거래처 구매내역 모드 -->
      <div id="stock-search-cust" class="search-row" style="display:none">
        <input class="search-input" id="stock-cust-q" placeholder="거래처명 입력 (예: 유월농장)" onkeydown="if(event.key==='Enter')searchCustProducts()">
        <button class="search-btn" onclick="searchCustProducts()">구매내역 조회</button>
      </div>
      
      <div id="stock-result"></div>
    </div>

    <div id="tab-balance" style="display:none">
      <div class="search-row">
        <input class="search-input" id="bal-q" placeholder="거래처명 검색..." onkeydown="if(event.key==='Enter')searchBalance()">
        <button class="toggle-btn" id="bal-unpaid-btn" onclick="toggleUnpaid()">미수금만</button>
        <button class="search-btn" onclick="searchBalance()">검색</button>
      </div>
      <div id="balance-result"></div>
    </div>

    <div id="tab-salesrank" style="display:none">
      <div class="search-row">
        <button class="toggle-btn on" id="sr-cat-all" onclick="setSalesRankCategory('all')">전체</button>
        <button class="toggle-btn" id="sr-cat-양계" onclick="setSalesRankCategory('양계')">🐔 양계</button>
        <button class="toggle-btn" id="sr-cat-양돈" onclick="setSalesRankCategory('양돈')">🐷 양돈</button>
        <button class="toggle-btn" id="sr-cat-축우" onclick="setSalesRankCategory('축우')">🐄 축우</button>
        <button class="toggle-btn" id="sr-cat-양견" onclick="setSalesRankCategory('양견')">🐕 양견</button>
        <button class="toggle-btn" id="sr-cat-동물병원/유통" onclick="setSalesRankCategory('동물병원/유통')">동물병원/유통</button>
        <button class="toggle-btn" id="sr-cat-미분류" onclick="setSalesRankCategory('미분류')">미분류</button>
      </div>
      <div class="search-row">
        <select class="filter" id="sr-topn" onchange="searchSalesRank()">
          <option value="20">상위 20곳</option>
          <option value="50" selected>상위 50곳</option>
          <option value="100">상위 100곳</option>
        </select>
      </div>
      <div id="salesrank-result"></div>
    </div>

    <div id="tab-txn" style="display:none">
      <div class="search-row">
        <input class="search-input" id="txn-company" placeholder="거래처명..." oninput="clearTxnAutoFilters()" onkeydown="if(event.key==='Enter')searchTxn()">
        <input class="search-input" id="txn-product" placeholder="품명..." onkeydown="if(event.key==='Enter')searchTxn()">
        <input type="date" class="search-input" id="txn-date" style="flex:0 0 auto" onchange="searchTxn()">
        <select class="filter" id="txn-acct" onchange="searchTxn()">
          <option value="">전체</option>
          <option value="매출">매출</option>
          <option value="매입">매입</option>
          <option value="수금">수금</option>
          <option value="지급">지급</option>
        </select>
        <button class="search-btn" onclick="searchTxn()">검색</button>
      </div>
      <div id="txn-result"></div>
    </div>

    <div id="tab-inactive" style="display:none">
      <div class="search-row">
        <button class="toggle-btn" id="inact-30-btn" onclick="setInactivePeriod(30)">30일 이상</button>
        <button class="toggle-btn on" id="inact-60-btn" onclick="setInactivePeriod(60)">60일 이상</button>
        <button class="toggle-btn" id="inact-90-btn" onclick="setInactivePeriod(90)">90일 이상</button>
        <button class="toggle-btn" id="inact-120-btn" onclick="setInactivePeriod(120)">120일 이상</button>
      </div>
      <div class="search-row">
        <button class="toggle-btn on" id="inact-cat-all" onclick="setCategory('all')">전체</button>
        <button class="toggle-btn" id="inact-cat-양계" onclick="setCategory('양계')">양계</button>
        <button class="toggle-btn" id="inact-cat-양돈" onclick="setCategory('양돈')">양돈</button>
        <button class="toggle-btn" id="inact-cat-축우" onclick="setCategory('축우')">축우</button>
        <button class="toggle-btn" id="inact-cat-양견" onclick="setCategory('양견')">양견</button>
        <button class="toggle-btn" id="inact-cat-동물병원/유통" onclick="setCategory('동물병원/유통')">동물병원</button>
        <button class="toggle-btn" id="inact-cat-미분류" onclick="setCategory('미분류')">미분류</button>
      </div>
      <div id="inactive-result"></div>
    </div>

    <div id="tab-info" style="display:none">
      <div class="search-row">
        <input class="search-input" id="info-q" placeholder="거래처명 검색..." onkeydown="if(event.key==='Enter')searchInfo()">
        <button class="search-btn" onclick="searchInfo()">검색</button>
      </div>
      <div id="info-result"></div>
    </div>

    <div id="tab-qia" style="display:none">
      <div class="search-row">
        <button class="toggle-btn on" id="qia-mode-name" onclick="setQiaMode('name')">제품명</button>
        <button class="toggle-btn" id="qia-mode-entp" onclick="setQiaMode('entp')">업체명</button>
        <button class="toggle-btn" id="qia-mode-ingr" onclick="setQiaMode('ingr')">성분명</button>
      </div>
      <div class="search-row">
        <input class="search-input" id="qia-q" placeholder="제품명을 입력하세요 (예: 이보멕)" onkeydown="if(event.key==='Enter')searchQia()">
        <select class="filter" id="qia-kind" onchange="searchQia()">
          <option value="">전체</option>
          <option value="A0">의약품</option>
          <option value="B0">의약외품</option>
        </select>
        <button class="search-btn" onclick="searchQia()">검색</button>
      </div>
      <div style="font-size:11px;color:var(--text3);margin-bottom:14px">농림축산검역본부(QIA) 동물용의약품통합정보시스템 공식 데이터를 실시간으로 조회합니다 · 오타나 초성이 섞여도 비슷한 이름을 찾아드려요 (예: '이버ㅁㅌ')</div>
      <div id="qia-result"></div>
    </div>
  </main>
</div>

<script>
// ── 상태 ─────────────────────────────────────────
let TOKEN = '';
let stockOnly = false, unpaidOnly = false;
const ACCESS_CODE = 'daehan2024';  // 접속 코드 (원하면 변경)
let dbReady = false;

window.addEventListener('fbready', () => { dbReady = true; });

// ── 로그인 ────────────────────────────────────────
function doLogin() {
  const t = document.getElementById('token-input').value.trim();
  if (t !== ACCESS_CODE) {
    document.getElementById('login-err').textContent = '접속 코드가 틀렸습니다';
    return;
  }
  if (!dbReady) {
    document.getElementById('login-err').textContent = '연결 중... 잠시 후 다시 시도하세요';
    setTimeout(() => { if (dbReady) doLogin(); }, 1500);
    return;
  }
  document.getElementById('login-screen').classList.add('hide');
  document.getElementById('app').classList.add('show');
  loadUploadInfo();  // 데이터 업데이트 일자 표시
  loadCategoryMap();  // 축종 매핑 로드 (백그라운드)
  loadProductSpecies();  // 제품 축종 로드
  searchStock();
}
window.doLogin = doLogin;

// ── 유틸 ─────────────────────────────────────────
function fmt억(n) {
  n = +n || 0;
  if (n >= 1e8) return (n/1e8).toFixed(1) + '억';
  if (n >= 1e4) return Math.round(n/1e4).toLocaleString() + '만';
  return n.toLocaleString();
}
function fmtNum(n) { return (+n||0).toLocaleString(); }
function todayStr() { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function loading(id) { document.getElementById(id).innerHTML = '<div class="loading"><span class="spinner"></span>클라우드 조회 중...</div>'; }
function empty(id) { document.getElementById(id).innerHTML = '<div class="empty">검색 결과가 없습니다</div>'; }

// ── 정렬 가능한 표 헤더 공통 유틸 ──────────────────
// state: { key, dir: 'asc'|'desc' } | null
// type: 'text'(기본 오름차순=가나다순) | 'num'(기본 내림차순=많은순) | 'date'(기본 내림차순=최근순)
function thSort(label, key, state, fnName, extraClass) {
  const active = state && state.key === key;
  const arrow = active ? (state.dir === 'asc' ? ' ▲' : ' ▼') : '';
  const cls = extraClass ? ` class="${extraClass}"` : '';
  return `<th${cls} onclick="${fnName}('${key}')" style="cursor:pointer;user-select:none${active?';color:var(--blue)':''}" title="클릭하여 정렬">${label}${arrow}</th>`;
}
function toggleSort(state, key, type) {
  if (state && state.key === key) return { key, dir: state.dir === 'asc' ? 'desc' : 'asc' };
  return { key, dir: type === 'text' ? 'asc' : 'desc' };
}
function sortBy(items, state, typeMap) {
  if (!state || !state.key) return items;
  const { key, dir } = state;
  const type = (typeMap && typeMap[key]) || 'text';
  const sorted = [...items].sort((a,b) => {
    if (type === 'num') return (+a[key]||0) - (+b[key]||0);
    // 날짜(YYYY-MM-DD)와 텍스트 모두 문자열 비교로 처리 (날짜 형식이 사전식 정렬과 시간순이 일치)
    return String(a[key]||'').localeCompare(String(b[key]||''), 'ko');
  });
  if (dir === 'desc') sorted.reverse();
  return sorted;
}

async function loadUploadInfo() {
  const el = document.getElementById('data-date');
  const { doc, getDoc } = window.fbFuncs;
  try {
    const snap = await getDoc(doc(window.fbdb, '메타', '업로드정보'));
    if (!snap.exists()) {
      el.textContent = '업데이트 정보 없음';
      return;
    }
    const m = snap.data();
    const 업로드일 = m.업로드일 || '';
    const 최신거래일 = m.최신거래일 || '';

    // 업데이트 경과일 계산
    let 경과표시 = '';
    if (업로드일) {
      const diff = Math.floor((new Date() - new Date(업로드일)) / 86400000);
      if (diff <= 0) 경과표시 = '오늘';
      else if (diff === 1) 경과표시 = '어제';
      else 경과표시 = `${diff}일 전`;
    }

    el.innerHTML = `📅 ${업로드일} 업데이트 <span style="color:var(--text3)">· ${경과표시}</span>`;
    el.style.cursor = 'pointer';
    el.title = `데이터 최신 거래일: ${최신거래일}\n업로드 시각: ${m.업로드일시 || ''}\n총 ${(m.총건수||0).toLocaleString()}건`;
    el.onclick = () => showUploadDetail(m);

    // 30일 넘으면 강조
    if (업로드일) {
      const diff = Math.floor((new Date() - new Date(업로드일)) / 86400000);
      if (diff >= 35) {
        el.style.borderColor = 'var(--amber)';
        el.style.color = 'var(--amber)';
      }
    }
  } catch(e) {
    el.textContent = '업데이트 정보 없음';
    console.warn('업로드 정보 로드 실패', e);
  }
}

// 제품 축종 저장
async function saveProductSpecies(품명, 축종) {
  const { doc, setDoc, deleteDoc } = window.fbFuncs;
  const safeId = 품명.replace(/\//g,'_').replace(/\./g,'_').replace(/#/g,'_').replace(/\[/g,'_').replace(/\]/g,'_');
  const ref = doc(window.fbdb, '제품축종', safeId);
  try {
    if (축종 === 'clear') {
      await deleteDoc(ref);
      delete 제품축종[품명];
    } else {
      await setDoc(ref, { 품명, 축종, 갱신일시: new Date().toISOString() });
      제품축종[품명] = 축종;
    }
    return true;
  } catch(e) {
    alert('저장 실패: ' + e.message);
    return false;
  }
}
window.saveProductSpecies = saveProductSpecies;

async function loadMfgList() {

  try {

const STOCK_SORT_TYPES = { 대분류:'text', 품명:'text', _축종:'text', 현재재고:'num', 판매소매단가:'num', 구매최종단가:'num' };

  stockSort = toggleSort(stockSort, key, STOCK_SORT_TYPES[key]);
  renderStockResult();
}

async function searchStock() {
  const q = document.getElementById('stock-q').value.trim().toLowerCase();
  const mfg = document.getElementById('stock-mfg').value;
  loading('stock-result');

  const { collection, query, getDocs, where, limit } = window.fbFuncs;
  const coll = collection(window.fbdb, '제품');

  try {
    let snap;
    if (stockOnly) {
      snap = await getDocs(query(coll, where('현재재고', '>', 0), limit(1200)));
    } else {
      snap = await getDocs(query(coll, limit(1200)));
    }

    let items = snap.docs.map(d => d.data());

    // 제조사 필터 (제조사별 모드)
    if (mfg) {
      items = items.filter(r => r.대분류 === mfg);
    }

    // 품명 검색
    if (q) {
      items = items.filter(r =>
        (r.품명||'').toLowerCase().includes(q) ||
        (r.대분류||'').toLowerCase().includes(q) ||
        (r.품명초성||'').includes(q)
      );
    }

    // 제품 축종 필터
    if (stockSpecies !== 'all') {
      items = items.filter(r => {
        const sp = 제품축종[r.품명] || '미지정';
        return sp === stockSpecies;
      });
    }

    items.forEach(r => { r._축종 = 제품축종[r.품명] || '미지정'; });

    stockItems = items;
    renderStockResult();
  } catch(e) {
    document.getElementById('stock-result').innerHTML = `<div class="empty">오류: ${e.message}</div>`;
  }
}
window.searchStock = searchStock;

      </tr></thead>

let custProdItems = [];
let custProdInfo = null;  // { 실제거래처, 총구매횟수 }
let custProdSort = { key: '구매횟수', dir: 'desc' };
const CUSTPROD_SORT_TYPES = { 대분류:'text', 품명:'text', 구매횟수:'num', 총수량:'num', 최근단가:'num', 최근구매:'date' };

async function searchCustProducts() {
  const company = document.getElementById('stock-cust-q').value.trim();
  if (!company) {
    document.getElementById('stock-result').innerHTML = '<div class="empty">거래처명을 입력하세요</div>';
    return;
  }
  loading('stock-result');

  const { collection, query, getDocs, where, orderBy, limit } = window.fbFuncs;
  const coll = collection(window.fbdb, '전표_세부');

  try {
    // 해당 거래처의 매출(=거래처가 구매) 세부 내역
    const snap = await getDocs(query(coll, where('회사','==',company), where('계정','==','매출'), orderBy('날짜','desc'), limit(3000)));
    let details = snap.docs.map(d => d.data());

    // 회사명 부분일치 재시도 (정확 매칭 실패 시)
    if (!details.length) {
      const allSnap = await getDocs(query(coll, where('계정','==','매출'), orderBy('날짜','desc'), limit(5000)));
      const kw = company.toLowerCase();
      details = allSnap.docs.map(d => d.data()).filter(r => (r.회사||'').toLowerCase().includes(kw));
    }

    if (!details.length) {
      document.getElementById('stock-result').innerHTML = `<div class="empty">${company}의 구매 내역이 없습니다</div>`;
      return;
    }

    // 품명별 집계
    const prodMap = new Map();
    details.forEach(r => {
      const key = r.품명 || '(미상)';
      const cur = prodMap.get(key) || { 품명:key, 대분류:r.대분류||'', 구매횟수:0, 총수량:0, 최근구매:'', 최근단가:0 };
      cur.구매횟수 += 1;
      cur.총수량 += (+r.수량||0);
      if ((r.날짜||'') > cur.최근구매) {
        cur.최근구매 = r.날짜 || '';
        cur.최근단가 = +r.단가 || 0;
      }
      prodMap.set(key, cur);
    });

    custProdItems = [...prodMap.values()];
    custProdInfo = { 실제거래처: details[0].회사, 총구매횟수: details.length };
    renderCustProdResult();
  } catch(e) {
    document.getElementById('stock-result').innerHTML = `<div class="empty">오류: ${e.message}</div>`;
    console.error(e);
  }
}
window.searchCustProducts = searchCustProducts;

function renderCustProdResult() {
  if (!custProdItems.length || !custProdInfo) { empty('stock-result'); return; }
  const { 실제거래처, 총구매횟수 } = custProdInfo;
  const 총품목 = custProdItems.length;
  const items = sortBy(custProdItems, custProdSort, CUSTPROD_SORT_TYPES);

  const rows = items.slice(0, 300).map(r => {
    const safeP = (r.품명||'').replace(/'/g,"\\'");

async function showProductBuyers(품명) {
  const html = `
    <div id="prod-buyers-modal" style="position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:400;display:flex;align-items:center;justify-content:center;padding:16px" onclick="closeProductBuyers(event)">
      <div style="background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:22px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto" onclick="event.stopPropagation()">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">
          <div>
            <div style="font-size:17px;font-weight:700">${품명}</div>
            <div style="font-size:11px;color:var(--text3)" id="pb-sub">불러오는 중...</div>
          </div>
          <button onclick="closeProductBuyers()" style="background:var(--bg3);border:none;color:var(--text2);border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:16px">✕</button>
        </div>
        <div id="pb-body"><div class="loading"><span class="spinner"></span>구매 거래처 조회 중...</div></div>
      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', html);

  const { collection, query, getDocs, where, limit } = window.fbFuncs;

  try {
    // 품명 단일 필드 일치 조건만 사용 (복합 색인 불필요) → 계정/정렬은 클라이언트에서 처리
    const snap = await getDocs(query(collection(window.fbdb,'전표_세부'), where('품명','==',품명), limit(3000)));
    const sales = snap.docs.map(d => d.data()).filter(r => r.계정 === '매출');

    if (!sales.length) {
      document.getElementById('pb-sub').textContent = '구매 이력 없음';
      document.getElementById('pb-body').innerHTML = `<div class="empty">이 제품을 구매한 거래처가 없습니다<br><span style="font-size:11px">(최근 1년치 데이터 기준)</span></div>`;
      return;
    }

    // 거래처별 집계
    const map = new Map();
    sales.forEach(r => {
      const key = r.회사 || '(미상)';
      const cur = map.get(key) || { 회사:key, 구매횟수:0, 총수량:0, 최근구매:'' };
      cur.구매횟수 += 1;
      cur.총수량 += (+r.수량||0);
      if ((r.날짜||'') > cur.최근구매) cur.최근구매 = r.날짜 || '';
      map.set(key, cur);
    });

    pbFarms = [...map.values()];
    pbSort = { key: '구매횟수', dir: 'desc' };

    document.getElementById('pb-sub').textContent = `${pbFarms.length}개 거래처 구매 (최근 1년치 데이터 기준)`;
    renderProductBuyers();
  } catch(e) {
    document.getElementById('pb-body').innerHTML = `<div class="empty">오류: ${e.message}</div>`;
    console.error(e);
  }
}

async function searchBalance() {
  const q = document.getElementById('bal-q').value.trim().toLowerCase();
  loading('balance-result');

  const { collection, query, getDocs, orderBy, limit, where } = window.fbFuncs;

  try {
    // 잔액 컬렉션 (미리 전체 기간으로 계산되어 저장됨) + 거래처 마스터 병렬 조회
    const balColl = collection(window.fbdb, '잔액');
    const custColl = collection(window.fbdb, '거래처');
    const [balSnap, custSnap] = await Promise.all([
      getDocs(query(balColl, orderBy('잔액', 'desc'), limit(1000))),
      getDocs(query(custColl, limit(2000)))
    ]);

    // 거래처 마스터 → 회사명별 이름/전화 매핑
    const custMap = new Map();
    custSnap.docs.forEach(d => {
      const r = d.data();
      if (r.회사) custMap.set(r.회사, { 이름: r.이름 || '', 전화: r.전화1 || '' });
    });

    let items = balSnap.docs.map(d => {
      const r = d.data();
      const info = custMap.get(r.회사) || {};
      return {
        ...r,
        이름: info.이름,
        전화: info.전화,
      };
    });

    // 필터 (회사명 + 담당자 이름 검색)
    if (q) items = items.filter(r =>
      (r.회사||'').toLowerCase().includes(q) ||
      (r.이름||'').toLowerCase().includes(q)
    );
    if (unpaidOnly) items = items.filter(r => r.잔액 > 0);

    balanceItems = items;
    renderBalanceResult();
  } catch(e) {
    document.getElementById('balance-result').innerHTML = `<div class="empty">오류: ${e.message}</div>`;
    console.error(e);
  }
}

async function searchTxn() {
  const company = document.getElementById('txn-company').value.trim();
  const product = document.getElementById('txn-product').value.trim().toLowerCase();
  const acct    = document.getElementById('txn-acct').value;
  const date    = document.getElementById('txn-date').value;

  if (!company && !product && !acct && !date) {
    document.getElementById('txn-result').innerHTML = '<div class="empty">거래처, 품명, 구분, 날짜 중 하나 이상 선택하세요</div>';
    return;
  }

  loading('txn-result');

  const { collection, query, getDocs, where, orderBy, limit } = window.fbFuncs;
  const coll = collection(window.fbdb, '전표_세부');

  try {
    let items = [];
    let matchedCompanies = new Set();

    if (company) {
      // 1단계: 정확한 거래처명으로 직접 조회 시도 (오래된 거래도 누락 없이 전부 잡힘)
      try {
        let exactConstraints = [where('회사', '==', company)];
        if (acct) exactConstraints.push(where('계정', '==', acct));
        if (date) exactConstraints.push(where('날짜', '==', date));
        exactConstraints.push(orderBy('날짜', 'desc'));
        exactConstraints.push(limit(5000));
        const exactSnap = await getDocs(query(coll, ...exactConstraints));
        items = exactSnap.docs.map(d => d.data());
      } catch(e) { console.warn('정확 일치 조회 실패, 부분 일치로 재시도', e); }
      items.forEach(r => matchedCompanies.add(r.회사));

      if (!items.length) {
        // 2단계: 정확히 일치하는 거래처가 없으면 최근 거래 중 이름 부분 일치로 재시도
        // (주의: 최근 5000건 범위 밖의 오래된 거래는 이 경로로는 찾지 못할 수 있음)
        let constraints = [];
        if (acct) constraints.push(where('계정', '==', acct));
        if (date) constraints.push(where('날짜', '==', date));
        constraints.push(orderBy('날짜', 'desc'));
        constraints.push(limit(5000));

        const snap = await getDocs(query(coll, ...constraints));
        const allDocs = snap.docs.map(d => d.data());

        const kw = company.toLowerCase();
        items = allDocs.filter(r => (r.회사||'').toLowerCase().includes(kw));
        items.forEach(r => matchedCompanies.add(r.회사));
      }
    } else {
      // 회사 조건 없이 계정/날짜만 조회
      let constraints = [];
      if (acct) constraints.push(where('계정', '==', acct));
      if (date) constraints.push(where('날짜', '==', date));
      constraints.push(orderBy('날짜', 'desc'));
      constraints.push(limit(date ? 3000 : 500));
      const snap = await getDocs(query(coll, ...constraints));
      items = snap.docs.map(d => d.data());
    }
    
    // 품명 필터
    if (product) items = items.filter(r => (r.품명||'').toLowerCase().includes(product));
    
    if (!items.length) { empty('txn-result'); return; }
    
    // 회사별 잔액 계산 (매칭된 회사가 정확히 1곳일 때만)
    let showBalance = false;
    let balanceMap = {};
    let targetCompany = '';
    let finalBalance = null;  // '잔액' 컬렉션 기준 최종잔액 요약 (최상단 표시용)

    if (matchedCompanies.size === 1) {
      targetCompany = [...matchedCompanies][0];
      const headColl = collection(window.fbdb, '전표_묶음');
      const balColl = collection(window.fbdb, '잔액');
      const [hsnap, bsnap] = await Promise.all([
        getDocs(query(headColl, where('회사','==',targetCompany), orderBy('날짜','asc'), limit(5000))),
        getDocs(query(balColl, where('회사','==',targetCompany), limit(1)))
      ]);
      // ERP 원본이 계산한 명세표 잔액누계를 그대로 사용
      hsnap.docs.forEach(d => {
        const r = d.data();
        if (r.전표번호) balanceMap[r.전표번호] = (+r.잔액누계 || 0);

    txnItems = items;
    txnCtx = { showBalance, balanceMap, targetCompany, finalBalance, matchedCompanyCount: matchedCompanies.size, company };
    renderTxnResult();
  } catch(e) {
    document.getElementById('txn-result').innerHTML = `<div class="empty">오류: ${e.message}</div>`;
    console.error(e);
  }
}

// 제품 구매이력 기반 거래처 축종 추론
// 각 거래처가 산 제품들의 축종을 집계, 가장 많이 산 축종으로 판단 (공통/미지정 제외)
async function inferCompanySpecies() {
  const { collection, query, getDocs, where, orderBy, limit } = window.fbFuncs;
  try {
    // 제품축종이 로드 안 됐으면 먼저 로드
    if (Object.keys(제품축종).length === 0) await loadProductSpecies();
    // 지정된 제품이 하나도 없으면 추론 불가
    if (Object.keys(제품축종).length === 0) { 거래처추론축종 = {}; return; }
    
    // 매출 세부내역 전체 조회
    const snap = await getDocs(query(collection(window.fbdb,'전표_세부'), where('계정','==','매출'), orderBy('날짜','desc'), limit(10000)));
    
    // 회사별 축종 카운트
    const counter = {};  // { 회사: { 양계: n, 양돈: n, 축우: n } }
    snap.docs.forEach(d => {
      const r = d.data();
      const 회사 = r.회사; const 품명 = r.품명;
      if (!회사 || !품명) return;
      const sp = 제품축종[품명];
      // 양계/양돈/축우만 카운트 (공통/미지정 제외)
      if (sp !== '양계' && sp !== '양돈' && sp !== '축우') return;
      counter[회사] = counter[회사] || {};
      counter[회사][sp] = (counter[회사][sp] || 0) + 1;
    });
    
    // 가장 많은 축종으로 결정
    거래처추론축종 = {};
    for (const [회사, counts] of Object.entries(counter)) {
      let best = null, bestN = 0;
      for (const [sp, n] of Object.entries(counts)) {
        if (n > bestN) { best = sp; bestN = n; }
      }
      if (best) 거래처추론축종[회사] = best;
    }
    console.log(`거래처 축종 추론: ${Object.keys(거래처추론축종).length}개`);
  } catch(e) {
    console.warn('거래처 축종 추론 실패', e);
  }
}

// 축종 매핑 저장 (개별)
async function saveCategoryMapping(회사, 축종) {
  const { doc, setDoc, deleteDoc } = window.fbFuncs;
  const safeId = 회사.replace(/\//g,'_').replace(/\./g,'_');
  const ref = doc(window.fbdb, '축종매핑', safeId);
  try {
    if (축종 === 'auto') {
      // 자동으로 되돌리기 - 매핑 삭제
      await deleteDoc(ref);
      delete 축종매핑[회사];
    } else {
      await setDoc(ref, { 회사, 축종, 갱신일시: new Date().toISOString() });
      축종매핑[회사] = 축종;
    }
    return true;
  } catch(e) {
    alert('저장 실패: ' + e.message);
    console.error(e);
    return false;
  }
}
window.saveCategoryMapping = saveCategoryMapping;

// 회사명 기반 자동 분류 (수동 매핑 > 제품추론 > 회사명 순)
function classifyCompany(name) {
  if (!name) return '미분류';
  // 1) 수동 매핑 최우선
  if (축종매핑[name]) return 축종매핑[name];
  // 2) 제품 구매이력 기반 추론
  if (거래처추론축종[name]) return 거래처추론축종[name];
  // 3) 회사명 자동 분류
  const n = name.toLowerCase();
  if (n.includes('양견') || n.startsWith('양견-')) return '양견';
  if (n.includes('한우') || n.startsWith('ch-') || n.startsWith('cc-') ||
      n.includes('축우') || n.includes('젖소') || n.includes('한육우') || n.includes('목장')) return '축우';
  if (n.includes('양계') || n.includes('계농') || n.includes('산란')) return '양계';
  if (n.includes('양돈') || n.includes('돈장') || n.includes('돼지') || n.includes('축돈')) return '양돈';
  if (n.includes('동물') || n.includes('수의') || n.includes('약품')) return '동물병원/유통';
  return '미분류';
}

const INACTIVE_SORT_TYPES = { 회사:'text', 축종:'text', 미거래일수:'num', 최종매출일:'date', 잔액:'num', 전화:'text', 담당사원:'text' };

async function searchInactive() {
  loading('inactive-result');
  
  const { collection, query, getDocs, where, limit } = window.fbFuncs;
  
  try {
    // 축종 매핑 + 제품 구매 기반 추론 재로드
    await loadCategoryMap();
    await inferCompanySpecies();
    
    // 잔액 컬렉션 (전체 기간 반영) + 거래처 마스터 병렬 조회
    const balColl = collection(window.fbdb, '잔액');
    const custColl = collection(window.fbdb, '거래처');
    const [balSnap, custSnap] = await Promise.all([
      getDocs(query(balColl, limit(2000))),
      getDocs(query(custColl, limit(2000)))
    ]);
    
    // 거래처 정보 맵
    const custMap = new Map();
    custSnap.docs.forEach(d => {
      const r = d.data();
      if (r.회사) custMap.set(r.회사, { 이름: r.이름 || '', 전화: r.전화1 || '', 담당사원: r.담당사원 || '' });
    });
    
    // 오늘 기준 미거래 일수 계산
    const today = new Date();
    today.setHours(0,0,0,0);
    
    let items = balSnap.docs
      .map(d => d.data())
      .filter(r => r.최종매출일)  // 매출 이력 있는 것만
      .map(r => {
        const lastDate = new Date(r.최종매출일);
        const diffDays = Math.floor((today - lastDate) / (1000*60*60*24));
        const info = custMap.get(r.회사) || {};
        return {
          ...r,
          미거래일수: diffDays,
          이름: info.이름,
          전화: info.전화,
          담당사원: info.담당사원,
          축종: classifyCompany(r.회사),
        };
      });
    
    // 기간 필터
    items = items.filter(r => r.미거래일수 >= inactiveDays);
    
    // 잔액 5만원 초과만 (5만원 이하 자동 제외)
    items = items.filter(r => r.잔액 > MIN_BALANCE);
    
    // 양견 카테고리는 미거래 관리에서 자동 제외 (별도 검색 시에는 표시)
    if (inactiveCategory !== '양견') {
      items = items.filter(r => r.축종 !== '양견');
    }
    
    // 축종 필터
    if (inactiveCategory !== 'all') {
      items = items.filter(r => r.축종 === inactiveCategory);
    }
    
    // 통계 요약
    inactiveTotalUnpaid = items.reduce((s,r) => s + r.잔액, 0);

    // 축종별 집계
    const catStats = {};
    items.forEach(r => {
      catStats[r.축종] = catStats[r.축종] || { 수: 0, 금액: 0 };
      catStats[r.축종].수 += 1;
      catStats[r.축종].금액 += r.잔액;
    });
    inactiveCatBadges = Object.entries(catStats)
      .sort((a,b) => b[1].금액 - a[1].금액)
      .map(([cat, s]) => {
        const 축종Color = {
          '축우':   '#7F77DD',
          '양계':   '#f0a050',
          '양돈':   '#e05555',
          '양견':   '#e879b3',
          '동물병원/유통': '#36c4a0',
          '미분류': 'var(--text3)',
        }[cat] || 'var(--text3)';
        return `<span style="display:inline-block;margin-right:8px;padding:3px 10px;border-radius:12px;background:${축종Color}22;color:${축종Color};font-size:11px;font-weight:600">${cat} ${s.수}곳 · ${fmt억(s.금액)}</span>`;
      }).join('');

    inactiveItems = items;
    renderInactiveResult();
  } catch(e) {
    document.getElementById('inactive-result').innerHTML = `<div class="empty">오류: ${e.message}</div>`;
    console.error(e);
  }
}

function renderInactiveResult() {
  if (!inactiveItems.length) { empty('inactive-result'); return; }
  const items = sortBy(inactiveItems, inactiveSort, INACTIVE_SORT_TYPES);

  const rows = items.slice(0, 300).map(r => {
      const cls = r.잔액 > 0 ? 'pos' : r.잔액 < 0 ? 'neg' : 'zero';
      const 이름표시 = r.이름 ? `<span style="font-size:11px;color:var(--text3);margin-left:6px">(${r.이름})</span>` : '';
      const safeName = (r.회사||'').replace(/'/g,"\\'");

  salesRankCategory = cat;
  ['all','양계','양돈','축우','양견','동물병원/유통','미분류'].forEach(c => {

  searchSalesRank();
}

let srItems = [];
let srCatBadges = '';
let srFilteredCount = 0;
let srSort = { key: '총매출', dir: 'desc' };
const SR_SORT_TYPES = { 회사:'text', 축종:'text', 총매출:'num', 잔액:'num', 최종매출일:'date' };

function setSrSort(key) {
  srSort = toggleSort(srSort, key, SR_SORT_TYPES[key]);
  renderSalesRank();
}

async function searchSalesRank() {
  loading('salesrank-result');
  const topN = +document.getElementById('sr-topn').value || 50;

  const { collection, query, getDocs, limit } = window.fbFuncs;

  try {
    // 축종 매핑 + 제품 구매 기반 추론 재로드
    await loadCategoryMap();
    await inferCompanySpecies();

    const balColl = collection(window.fbdb, '잔액');
    const custColl = collection(window.fbdb, '거래처');
    const [balSnap, custSnap] = await Promise.all([
      getDocs(query(balColl, limit(2000))),
      getDocs(query(custColl, limit(2000)))
    ]);

    const custMap = new Map();
    custSnap.docs.forEach(d => {
      const r = d.data();
      if (r.회사) custMap.set(r.회사, { 이름: r.이름 || '', 전화: r.전화1 || '', 담당사원: r.담당사원 || '' });
    });

    const 전체목록 = balSnap.docs
      .map(d => d.data())
      .filter(r => (r.총매출 || 0) > 0)
      .map(r => {
        const info = custMap.get(r.회사) || {};
        return {
          ...r,
          이름: info.이름,
          전화: info.전화,
          담당사원: info.담당사원,
          축종: classifyCompany(r.회사),
        };
      });

    // 축종별 집계 (필터 적용 전 전체 기준)
    const catStats = {};
    전체목록.forEach(r => {
      catStats[r.축종] = catStats[r.축종] || { 수: 0, 금액: 0 };
      catStats[r.축종].수 += 1;
      catStats[r.축종].금액 += (r.총매출 || 0);
    });

    // 축종 필터
    let items = salesRankCategory === 'all'
      ? 전체목록
      : 전체목록.filter(r => r.축종 === salesRankCategory);

    // 매출 많은 순으로 상위 N 선정 (topN은 항상 누적매출 기준으로 뽑고, 뽑힌 안에서 원하는 열로 재정렬 가능)
    items.sort((a,b) => (b.총매출||0) - (a.총매출||0));
    srFilteredCount = items.length;
    srItems = items.slice(0, topN);

    const 축종Color = {
      '축우':   '#7F77DD',
      '양계':   '#f0a050',
      '양돈':   '#e05555',
      '양견':   '#e879b3',
      '동물병원/유통': '#36c4a0',
      '미분류': 'var(--text3)',
    };

    srCatBadges = Object.entries(catStats)
      .sort((a,b) => b[1].금액 - a[1].금액)
      .map(([cat, s]) => {
        const c = 축종Color[cat] || 'var(--text3)';
        return `<span onclick="setSalesRankCategory('${cat}')" style="cursor:pointer;display:inline-block;margin-right:8px;padding:3px 10px;border-radius:12px;background:${c}22;color:${c};font-size:11px;font-weight:600">${cat} ${s.수}곳 · ${fmt억(s.금액)}</span>`;
      }).join('');

    renderSalesRank();
  } catch(e) {
    document.getElementById('salesrank-result').innerHTML = `<div class="empty">오류: ${e.message}</div>`;
    console.error(e);
  }
}
window.searchSalesRank = searchSalesRank;

        <th class="hide-mobile">담당사원</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;

async function searchInfo() {
  const q = document.getElementById('info-q').value.trim().toLowerCase();
  loading('info-result');

  const { collection, query, getDocs, limit } = window.fbFuncs;
  const custColl = collection(window.fbdb, '거래처');
  const balColl = collection(window.fbdb, '잔액');

  try {
    const [custSnap, balSnap] = await Promise.all([
      getDocs(query(custColl, limit(2000))),
      getDocs(query(balColl, limit(2000)))
    ]);

    // 회사별 최종매출일 매핑
    const lastSaleMap = new Map();
    balSnap.docs.forEach(d => {
      const r = d.data();
      if (r.회사 && r.최종매출일) lastSaleMap.set(r.회사, r.최종매출일);
    });

    let items = custSnap.docs.map(d => {
      const r = d.data();
      return { ...r, 최종매출일: lastSaleMap.get(r.회사) || '' };
    });

    // 회사명 또는 담당자 이름으로 검색
    if (q) items = items.filter(r =>
      (r.회사||'').toLowerCase().includes(q) ||
      (r.이름||'').toLowerCase().includes(q)
    );

    infoItems = items;
    renderInfoResult();
  } catch(e) {
    document.getElementById('info-result').innerHTML = `<div class="empty">오류: ${e.message}</div>`;
  }
}

          onclick="closeCompanyDetail();goTxnByCompany('${company.replace(/'/g,"\\'")}')">
          전체 거래내역 보기 →
        </button>
      </div>
      <div style="font-size:11px;color:var(--text3);margin-bottom:8px">최근 거래내역 (최대 30건)</div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>날짜</th><th>구분</th><th>품명</th><th class="num">수량</th><th class="num">금액</th></tr></thead>
        <tbody>${txnRows}</tbody>
      </table></div>`;
  } catch(e) {
    document.getElementById('cd-body').innerHTML = `<div class="empty">오류: ${e.message}<br><span style="font-size:11px">인덱스 생성이 필요할 수 있습니다</span></div>`;
    console.error(e);
  }
}
window.showCompanyDetail = showCompanyDetail;

function closeCompanyDetail(e) {
  if (e && e.target.id !== 'company-detail-modal') return;
  const m = document.getElementById('company-detail-modal');
  if (m) m.remove();
}
window.closeCompanyDetail = closeCompanyDetail;

// ── 동물약품 검색 (QIA 동물용의약품통합정보시스템 실시간 조회) ──
const QIA_BASE = 'https://medi.qia.go.kr';
let qiaMode = 'name';
let qiaQuery = '', qiaKind = '', qiaPage = 1, qiaTotal = 0;
let qiaRows = [];
let qiaFuzzy = false;

function setQiaMode(mode) {
  qiaMode = mode;
  ['name','entp','ingr'].forEach(m => document.getElementById('qia-mode-'+m).classList.toggle('on', m === mode));
  document.getElementById('qia-q').placeholder =
    mode === 'name' ? '제품명을 입력하세요 (예: 이보멕)' :
    mode === 'entp' ? '업체명을 입력하세요 (예: 베링거)' :
    '성분명을 입력하세요 (예: 이버멕틴)';
}
window.setQiaMode = setQiaMode;

function parseQiaHtml(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const getVal = td => {
    const spans = td.querySelectorAll('span');
    return spans.length >= 2 ? spans[1].textContent.trim() : td.textContent.trim();
  };
  const rows = [...doc.querySelectorAll('table tbody tr')].map(tr => {
    const tds = [...tr.querySelectorAll('td')];
    if (tds.length < 13) return null;
    const link = tds[1].querySelector('a');
    return {
      제품명: getVal(tds[1]),
      링크: link ? (QIA_BASE + link.getAttribute('href')) : '',
      제품영문명: getVal(tds[2]),
      업체명: getVal(tds[3]),
      허가일: getVal(tds[6]),
      품목구분: getVal(tds[7]),
      주성분: getVal(tds[8]),
      제조수입: getVal(tds[11]),
    };
  }).filter(Boolean);
  const m = doc.body.textContent.match(/총\s*([\d,]+)\s*건/);
  const total = m ? +m[1].replace(/,/g,'') : rows.length;
  return { rows, total };
}

async function fetchQiaSearch(term, page) {
  const params = new URLSearchParams({ page: String(page), searchDivision: 'detail' });
  if (qiaMode === 'name') params.set('itemName', term);
  else if (qiaMode === 'entp') params.set('entpName', term);
  else params.set('ingrMainName', term);  // 성분명 (비공식 파라미터, QIA 폼에는 노출 안 됨)
  if (qiaKind) params.set('indutyClassCode', qiaKind);
  const res = await fetch(QIA_BASE + '/searchMedicine?' + params.toString());
  if (!res.ok) throw new Error('QIA 서버 오류 (' + res.status + ')');
  return parseQiaHtml(await res.text());
}

async function fetchQiaPage(page) {
  return fetchQiaSearch(qiaQuery, page);
}

// ── 오타/유사 키워드 허용 검색 ─────────────────────
// 편집거리(레벤슈타인) 기반 유사도: 0(완전 다름) ~ 1(완전 일치)
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  const dp = new Array(n+1);
  for (let j=0;j<=n;j++) dp[j] = j;
  for (let i=1;i<=m;i++) {
    let prev = dp[0];
    dp[0] = i;
    for (let j=1;j<=n;j++) {
      const tmp = dp[j];
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      dp[j] = Math.min(dp[j]+1, dp[j-1]+1, prev+cost);
      prev = tmp;
    }
  }
  return dp[n];
}
// 한글 초성 추출 (완성형 음절 → 초성, 이미 자모/영문/숫자는 그대로 유지)
const CHOSEONG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function toChoseong(str) {
  let out = '';
  for (const ch of str) {
    const code = ch.charCodeAt(0) - 0xAC00;
    out += (code >= 0 && code <= 11171) ? CHOSEONG[Math.floor(code / 588)] : ch;
  }
  return out;
}
// 입력이 초성(자음)으로만 이루어졌는지 (예: 'ㅇㅂㅁㅌ')
function isChoseongOnly(str) {
  const s = (str||'').replace(/\s+/g,'');
  return s.length > 0 && /^[ㄱ-ㅎ]+$/.test(s);
}

// 일반 편집거리 유사도와 초성 편집거리 유사도 중 더 높은 쪽을 채택
// → 오타(음절이 살짝 다름)와 초성 검색(자음만 일치) 둘 다 자연스럽게 커버됨
function qiaSimilarity(a, b) {
  a = (a||'').toLowerCase().replace(/\s+/g,'');
  b = (b||'').toLowerCase().replace(/\s+/g,'');
  if (!a || !b) return 0;
  const litSim = 1 - levenshtein(a, b) / Math.max(a.length, b.length);
  const choSim = 1 - levenshtein(toChoseong(a), toChoseong(b)) / Math.max(a.length, b.length);
  return Math.max(litSim, choSim);
}

// 정확검색 실패시 시도할 후보어 생성: 공백 토큰(긴 것부터) + 뒤에서부터 한 글자씩 줄인 접두사
function qiaFuzzyCandidates(q) {
  const seen = new Set([q]);
  const list = [];
  q.split(/\s+/).filter(t => t.length >= 2).sort((a,b) => b.length-a.length).forEach(t => {
    if (!seen.has(t)) { seen.add(t); list.push(t); }
  });
  for (let len = q.length - 1; len >= 2; len--) {
    const p = q.slice(0, len);
    if (!seen.has(p)) { seen.add(p); list.push(p); }
  }
  return list;
}

// 후보어들로 QIA를 순차 조회, 결과를 모아 원래 검색어와의 유사도순으로 정렬
async function fuzzySearchQia(q) {
  const candidates = qiaFuzzyCandidates(q);
  const collected = new Map();
  let tries = 0;
  for (const cand of candidates) {
    if (tries >= 6 || collected.size >= 60) break;
    tries++;
    try {
      const { rows } = await fetchQiaSearch(cand, 1);
      rows.forEach(r => {
        const key = r.링크 || (r.제품명 + '|' + r.업체명);
        if (!collected.has(key)) collected.set(key, r);
      });
    } catch(e) { /* 후보 하나 실패해도 계속 진행 */ }
    if (collected.size >= 15) break;
  }
  const field = qiaMode === 'name' ? '제품명' : qiaMode === 'entp' ? '업체명' : '주성분';
  const scored = [...collected.values()]
    .map(r => ({ ...r, _sim: qiaSimilarity(q, r[field]) }))
    .filter(r => r._sim >= 0.3)
    .sort((a,b) => b._sim - a._sim);
  return scored.slice(0, 30);
}

async function searchQia() {
  const q = document.getElementById('qia-q').value.trim();
  qiaKind = document.getElementById('qia-kind').value;
  if (!q) {
    document.getElementById('qia-result').innerHTML = '<div class="empty">검색어를 입력하세요</div>';
    return;
  }
  if (isChoseongOnly(q)) {
    document.getElementById('qia-result').innerHTML = `<div class="empty">초성만으로는 QIA 전체 데이터를 검색할 수 없어요<br><span style="font-size:11px">글자를 한 자 이상 입력해주세요 (예: 'ㅇㅂㅁㅌ' 대신 '이버' 또는 '이버멕틴')</span></div>`;
    return;
  }
  qiaQuery = q;
  qiaPage = 1;
  qiaFuzzy = false;
  loading('qia-result');
  try {
    const { rows, total } = await fetchQiaPage(1);
    if (rows.length) {
      qiaRows = rows;
      qiaTotal = total;
      qiaFuzzy = false;
    } else {
      // 정확히 일치하는 결과가 없음 → 비슷한 키워드로 재조회
      document.getElementById('qia-result').innerHTML = '<div class="loading"><span class="spinner"></span>정확한 일치 결과가 없어 비슷한 이름을 찾는 중...</div>';
      const fuzzyRows = await fuzzySearchQia(q);
      qiaRows = fuzzyRows;
      qiaTotal = fuzzyRows.length;
      qiaFuzzy = true;
    }
    renderQiaResult();
  } catch(e) {
    document.getElementById('qia-result').innerHTML = `<div class="empty">조회 실패: ${e.message}<br><span style="font-size:11px">농림축산검역본부(QIA) 서버 연결에 문제가 있을 수 있습니다</span></div>`;
    console.error(e);
  }
}
window.searchQia = searchQia;

async function loadMoreQia() {
  if (qiaFuzzy) return;  // 유사검색 결과는 이미 유사도순 상위 결과라 페이지네이션 없음
  qiaPage += 1;
  const btn = document.getElementById('qia-more-btn');
  if (btn) { btn.disabled = true; btn.textContent = '불러오는 중...'; }
  try {
    const { rows } = await fetchQiaPage(qiaPage);
    qiaRows = qiaRows.concat(rows);
    renderQiaResult();
  } catch(e) {
    alert('추가 조회 실패: ' + e.message);
    qiaPage -= 1;
  }
}
window.loadMoreQia = loadMoreQia;

function renderQiaResult() {
  if (!qiaRows.length) { empty('qia-result'); return; }

  const rows = qiaRows.map(r => `<tr>
    <td>${r.링크 ? `<a href="${r.링크}" target="_blank" rel="noopener" style="color:var(--blue);font-weight:600">${r.제품명||''} ↗</a>` : `<strong>${r.제품명||''}</strong>`}</td>
    <td class="hide-mobile" style="font-size:11px;color:var(--text3)">${r.제품영문명||''}</td>
    <td>${r.업체명||''}</td>
    <td><span class="tag ${r.품목구분==='동물용의약품'?'tag-매출':'tag-매입'}">${r.품목구분||''}</span></td>
    <td class="hide-mobile">${r.주성분||''}</td>
    <td class="hide-mobile" style="font-size:11px;color:var(--text3)">${r.허가일||''}</td>
    <td class="hide-mobile">${r.제조수입||''}</td>
  </tr>`).join('');

  const hasMore = !qiaFuzzy && qiaRows.length < qiaTotal;
  const moreBtn = hasMore
    ? `<button id="qia-more-btn" class="toggle-btn" style="width:100%;margin-top:10px" onclick="loadMoreQia()">더 보기 (${qiaRows.length} / ${qiaTotal})</button>`
    : '';

  const fuzzyBanner = qiaFuzzy
    ? `<div style="margin-bottom:10px;padding:10px 14px;background:var(--bg3);border:1px solid var(--amber);border-radius:8px;font-size:12px;color:var(--amber)">
        "${qiaQuery}"의 정확한 일치 결과가 없어, 비슷한 이름의 결과 ${qiaRows.length}건을 유사도순으로 보여드립니다
      </div>`
    : '';

  const infoLine = qiaFuzzy
    ? `유사 검색 결과 ${qiaRows.length}건 · 제품명 클릭시 공식 상세정보(새창)`
    : `QIA 공식 데이터 · 총 ${qiaTotal.toLocaleString()}건 중 ${qiaRows.length}건 표시 · 제품명 클릭시 공식 상세정보(새창)`;

  document.getElementById('qia-result').innerHTML = `
    ${fuzzyBanner}
    <div style="font-size:11px;color:var(--text3);margin-bottom:8px">${infoLine}</div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>제품명</th><th class="hide-mobile">영문명</th><th>업체명</th><th>구분</th><th class="hide-mobile">주성분</th><th class="hide-mobile">허가일</th><th class="hide-mobile">제조/수입</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    ${moreBtn}`;
}
</script>
